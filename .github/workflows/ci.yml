# CI — enforces the Quickstart contract (CLAUDE.md) on every push/PR:
# a fresh clone must sync, lint, test, and show no data-manifest drift.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # justify: pin to the version validated locally (uv 0.11.7,
          # 2026-04-15 build) so CI resolution matches the committed uv.lock
          version: "0.11.7"

      - name: Sync environment (frozen lockfile)
        run: uv sync --frozen --extra dev --extra data --extra viz

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      - name: Data-manifest drift check
        run: uv run python scripts/build_data_manifest.py --check

      - name: CITATION.cff validation
        run: uv run python scripts/hooks/precommit_citation_cff.py CITATION.cff
