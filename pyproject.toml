[project]
name = "SKIE-Universe-2"
version = "0.0.1"
description = "SKIE-Universe-2 (quant project bootstrapped from s-koirala/dotfiles)"
requires-python = ">=3.11,<3.13"
authors = [{name = "<<TODO: author>>"}]
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
# Justify: ruff/pytest/pre-commit are the user's tooling defaults
# (CLAUDE.md "Tooling defaults"). nbstripout + nbqa for notebooks.
dev = [
    "ruff",
    "pytest",
    "pre-commit",
    "nbstripout",
    "nbqa",
    "pyyaml",          # for precommit_citation_cff.py
    "jsonschema>=4.18", # Draft 2020-12 support; justify: R1-A schema needs Draft 2020-12
]

# Justify: pandera for schema validation (validate-data SKILL.md §2);
# pandas/numpy/scipy are the foundational data stack.
data = [
    "pandas",
    "numpy",
    "scipy",
    "pandera",
    "pyarrow",          # parquet
    # justify: the Phase C roll-adjusted ingest is a numerical-fidelity port
    # of SKIE-Universe 1.0 src/skie_ninja/data/ingest/*.py, which is
    # implemented in polars. Rewriting in pandas would forfeit the exact
    # benchmark comparison mandated by config/data_sources.yaml
    # (skie_universe_1_processed_roll_adjusted). Pinned ==1.40.0 to match the
    # 1.0 reference venv exactly: frame_sha256 canonicalization is documented
    # as a polars-version surface (1.0 utils/hashing.py docstring), so a
    # version skew would confound the numerical cross-validation.
    "polars==1.40.0",
]

# Justify: matplotlib/seaborn for figures; defaults set by deliver-results
# skill's skie.mplstyle (R2-C).
viz = [
    "matplotlib",
    "seaborn",
    "great_tables",     # publication tables (R2-C)
]

# Defer per memo §5 Q1 default = no build-system declaration; matches
# SKIE-Universe pattern. To make installable, add:
# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"
# and drop `package = false` below.

[tool.uv]
# Research repo, not a distributable package: uv must not attempt to build
# or install the project itself (an empty [build-system] table is
# schema-invalid and breaks `uv sync` on a fresh clone).
package = false

[tool.ruff]
line-length = 100  # justify: user's CLAUDE.md tooling defaults; matches SKIE-Universe
target-version = "py311"
src = ["src"]
# Vendored verbatim from s-koirala/dotfiles (linted in its home repo);
# excluded here so local lint config does not force divergence from upstream.
extend-exclude = [
    "scripts/hooks/precommit_seed_guard.py",
    "scripts/hooks/precommit_citation_cff.py",
    "scripts/build_data_manifest.py",
]

[tool.ruff.lint]
# Justify: E/F/W from pycodestyle/pyflakes; I from isort; N for naming;
# B from bugbear; UP for pyupgrade; SIM for simplification; PL for pylint
# (with PLR0913 disabled — too many args is sometimes unavoidable in
# research code where signatures grow naturally).
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# Justify: test assertions compare against literal expectations derived
# from the synthetic fixtures defined in the same file (e.g. 5 fixture
# rows, 64 hex chars of SHA-256) — naming each would obscure, not
# document. The magic-number policy (CLAUDE.md) targets tunable
# analysis parameters, which tests do not introduce.
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
