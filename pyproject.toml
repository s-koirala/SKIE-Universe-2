[project]
name = "SKIE-Universe-2"
version = "0.0.1"
description = "SKIE-Universe-2 (quant project bootstrapped from s-koirala/dotfiles)"
requires-python = ">=3.11,<3.13"
authors = [{name = "<<TODO: author>>"}]
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
# Justify: ruff/pytest/pre-commit are the user's tooling defaults
# (CLAUDE.md "Tooling defaults"). nbstripout + nbqa for notebooks.
dev = [
    "ruff",
    "pytest",
    "pre-commit",
    "nbstripout",
    "nbqa",
    "pyyaml",          # for precommit_citation_cff.py
    "jsonschema>=4.18", # Draft 2020-12 support; justify: R1-A schema needs Draft 2020-12
]

# Justify: pandera for schema validation (validate-data SKILL.md §2);
# pandas/numpy/scipy are the foundational data stack.
data = [
    "pandas",
    "numpy",
    "scipy",
    "pandera",
    "pyarrow",          # parquet
    # justify: the Phase C roll-adjusted ingest is a numerical-fidelity port
    # of SKIE-Universe 1.0 src/skie_ninja/data/ingest/*.py, which is
    # implemented in polars. Rewriting in pandas would forfeit the exact
    # benchmark comparison mandated by config/data_sources.yaml
    # (skie_universe_1_processed_roll_adjusted). Pinned ==1.40.0 to match the
    # 1.0 reference venv exactly: frame_sha256 canonicalization is documented
    # as a polars-version surface (1.0 utils/hashing.py docstring), so a
    # version skew would confound the numerical cross-validation.
    "polars==1.40.0",
]

# Justify: the H900 dwell-time study (research/01_hypothesis_register/H900/
# design.md §5) mandates a numerical-fidelity port of the SKIE-Universe 1.0
# HMM toolkit (src/skie_ninja/models/regime/), whose k-means++ EM warm start
# is implemented via sklearn.cluster.KMeans (Arthur & Vassilvitskii 2007) and
# whose forward-backward hot loops dispatch to numba @njit kernels (1.0
# _em_kernels.py; 400-1200x measured speedup over the scipy path at the
# production T — see the 1.0 module docstring benchmark table). Rewriting
# either would forfeit the exact-port fidelity the design requires; without
# numba the 15-window x 6-cell x 5-restart EM grid is computationally
# infeasible (O(100 h) on the scipy path). numba 0.66 constrains numpy<2.5,
# which is why the lock resolves numpy 2.4.x.
models = [
    "scikit-learn",
    "numba",
]

# Justify: matplotlib/seaborn for figures; defaults set by deliver-results
# skill's skie.mplstyle (R2-C).
viz = [
    "matplotlib",
    "seaborn",
    "great_tables",     # publication tables (R2-C)
]

# Defer per memo §5 Q1 default = no build-system declaration; matches
# SKIE-Universe pattern. To make installable, add:
# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"
# and drop `package = false` below.

[tool.uv]
# Research repo, not a distributable package: uv must not attempt to build
# or install the project itself (an empty [build-system] table is
# schema-invalid and breaks `uv sync` on a fresh clone).
package = false

[tool.ruff]
line-length = 100  # justify: user's CLAUDE.md tooling defaults; matches SKIE-Universe
target-version = "py311"
src = ["src"]
# Vendored verbatim from s-koirala/dotfiles (linted in its home repo);
# excluded here so local lint config does not force divergence from upstream.
extend-exclude = [
    "scripts/hooks/precommit_seed_guard.py",
    "scripts/hooks/precommit_citation_cff.py",
    "scripts/build_data_manifest.py",
]

[tool.ruff.lint]
# Justify: E/F/W from pycodestyle/pyflakes; I from isort; N for naming;
# B from bugbear; UP for pyupgrade; SIM for simplification; PL for pylint
# (with PLR0913 disabled — too many args is sometimes unavoidable in
# research code where signatures grow naturally).
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# Justify: test assertions compare against literal expectations derived
# from the synthetic fixtures defined in the same file (e.g. 5 fixture
# rows, 64 hex chars of SHA-256) — naming each would obscure, not
# document. The magic-number policy (CLAUDE.md) targets tunable
# analysis parameters, which tests do not introduce.
"tests/*" = ["PLR2004"]
# Justify: PLR2004 hits in these pure-indicator / covariate-emitter modules are
# STRUCTURAL API-contract minimums (ddof=1 sample std needs >= 2 points; a
# rolling slope / window needs >= 2 bars; an EMA span >= 1), not tunable
# analysis parameters. The magic-number policy (CLAUDE.md) targets tunable
# analysis values, which these guards are not — consistent with the numerical
# per-file ignores below. All ANALYSIS parameters (H001 window grid, horizons,
# discretizer) live data-derived in the frozen design, not as literals here.
"src/skie_universe2/signals/indicators.py" = ["PLR2004"]
"src/skie_universe2/signals/regime_covariate.py" = ["PLR2004"]
# Justify: numerical-fidelity ports of SKIE-Universe@ce018515 (H900
# design.md §5 mandates porting the 1.0 HMM toolkit + bootstrap with
# their unit tests; ADR-0008 audit-and-lift). The 1.0 source predates
# this repo's lint profile; renaming its math-notation identifiers
# (log_B, M, K_N, ...) or restructuring its branches would break 1:1
# diffability against the audited 1.0 source and risk transcription
# defects in verified numerical code. Scoped to the ported files only.
"src/skie_universe2/models/regime/_core.py" = ["N802", "N803", "N806", "PLR2004", "PLR0912", "PLR0915", "PLR1730"]
"src/skie_universe2/models/regime/_em_kernels.py" = ["N802", "N803", "N806", "PLR2004", "PLR0912", "PLR1730"]
"src/skie_universe2/models/regime/hmm.py" = ["N802", "N803", "N806", "PLR2004", "PLR0912", "PLR0915", "PLC0415", "I001", "SIM114", "PLR1714"]
"src/skie_universe2/models/regime/selection.py" = ["N802", "N803", "N806", "PLR2004", "PLR0912"]
"src/skie_universe2/inference/bootstrap.py" = ["N802", "N803", "N806", "PLR2004", "PLR0912", "PLR1730"]
"tests/test_regime_hmm_core.py" = ["N802", "N803", "N806", "I001", "F401", "PLC0415"]
"tests/test_regime_hmm_fit.py" = ["N802", "N803", "N806"]
"tests/test_regime_hmm_selection.py" = ["PLC0206"]
"tests/test_inference_bootstrap.py" = ["N802", "N803", "N806", "I001", "B905", "B017"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
