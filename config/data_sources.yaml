# Upstream data-source registry — mandated by ADR-0011 Decision 3.
# Every external source consumed by this project must be registered here
# BEFORE ingest; ingest modules refuse unregistered sources.
#
# Checksums: machine-level raw files carry SHA-256 in their retrieval-time
# provenance sidecars (ADR-0011 Decision 4); per-file SHA-256 of everything
# materialized under data/ lands in data/_manifest.json at ingest time.
# This registry records locations, licenses, and coverage — not per-file
# hashes.

schema_version: 1

sources:
  vendor_skie_ninja_legacy_raw_1min:
    kind: vendor_raw
    location: "~/datasets/vendor_skie_ninja_legacy/raw_1min/"
    vendor_chain: "Databento GLBX.MDP3 ohlcv-1m -> per-symbol/per-year CSV"
    file_pattern: "{SYMBOL}_{YEAR|YEARH1|''}_1min_databento.csv"
    symbols: [ES, NQ, MCL, MGC, SIL]
    coverage_note: >-
      ES/NQ per-year files 2015-2026H1 plus undated full-history files;
      MCL/MGC/SIL full-history CSV + .dbn.zst. Row counts and per-file
      SHA-256 recorded at ingest into data/_manifest.json.
    license:
      status: verified
      note: "Databento research-tier license; same owner as this repo (s-koirala)."
      verified_at: "2026-04-23"
      verified_by: "user-confirmation-2026-04-23 (1.0 audit trail)"
    upstream_reference: >-
      SKIE-Universe 1.0 docs/audits/audit_trail_2026-04-23_vendor-legacy-1min-ingest.md
      (3,733,906 rows ES 2020-2025 + NQ 2020-2024 at first ingest; store has
      since been extended to 2015-2026H1 and additional symbols).
    intended_use: >-
      Sole raw substrate for the Phase C roll-adjusted continuous-contract
      evidence bars and shadow-ledger backfill (ADR-0003 Decision 5).
    substrate_defects:
      - id: DEC_ROLL_LATE_COMMIT
        severity: critical
        confirmed: "2026-07-10 (round-1 audit QUANT-1-1; verified against the Phase C provenance roll events)"
        description: >-
          Per-year ES/NQ raw files contain only same-year-expiry contracts,
          so the December volume-crossover into the next year's H (March)
          contract is invisible until the next year's file begins. Every
          Z->H roll 2016-2025 therefore commits at the FIRST JANUARY
          session, ~3 weeks after the true mid-December crossover
          (equity-index roll convention: volume migrates ~8 calendar days
          before last-trade; attribution note 2026-07-19 — no official CME
          citation is on file, pin one at repair registration; audit
          finding LITERATURE-1-4).
          Bars in each late window (~Dec 08 .. first January session, per
          year) carry a misattributed front-month in every derivative built
          from this store, including the registered 1.0 reference output —
          the Phase C bit-exact benchmark match therefore demonstrates port
          fidelity, NOT substrate correctness. Machine-readable per-run
          detail is emitted in the roll-adjusted provenance coverage_gaps
          field.
        repair: >-
          Re-pull December-spanning windows (at minimum Dec 01 -> Jan 15
          around each year boundary, all affected symbols) from Databento
          GLBX.MDP3. Requires operator-authorized spend (1.0 ADR-0023
          precedent). Registered follow-up: P1-2.0-DATABENTO-DEC-ROLL-REPULL.
          Do NOT patch in code — the defect is in the raw substrate.
          SUPERSEDING REPAIR SOURCE registered 2026-07-19 (spend authorized
          at governance level, execution operator-only, pull PENDING):
          vendor_databento_dec_roll_repair_1min (below). This defect record
          is retained unedited per ADR-0011; the repair entry's coverage
          becomes authoritative for the affected windows once its
          retrieval-time checksums exist.
        roll_convention_citation: >-
          CME Group official convention (pinned 2026-07-19, closing the
          audit LITERATURE-1-4 attribution gap): the equity roll date is
          the MONDAY PRIOR TO THE THIRD FRIDAY of the expiration month,
          after which the second-nearest expiry is the "lead month" —
          https://www.cmegroup.com/trading/equity-index/rolldates.html and
          https://www.cmegroup.com/education/courses/introduction-to-futures/
          understanding-futures-expiration-contract-roll (both cmegroup.com,
          fetched 2026-07-19). For December expiries the roll Monday falls
          ~Dec 08-14, consistent with the registered
          expected_crossover_window starts (~Dec 08).

  vendor_databento_dec_roll_repair_1min:
    kind: vendor_raw
    status: REGISTERED-PENDING-PULL  # registration precedes ingest (ADR-0011 D3); no data exists yet
    location: "~/datasets/vendor_databento_dec_roll_repair/raw_1min/"
    vendor_chain: "Databento GLBX.MDP3 ohlcv-1m -> single continuous multi-window request per symbol set"
    file_pattern: "{REQUEST_ID}_{SYMBOL_SET}_1min_databento.{csv|dbn.zst}"
    symbols: [ES, NQ]
    coverage_note: >-
      DR-1: the 10 December-roll boundary windows Dec 01 -> Jan 15,
      2015/16 through 2024/25 (46 calendar days each). DR-2: 2025-12-01 ->
      2026-01-15 including the ES tail from 2025-12-04 (ES raw ends
      2025-12-03 vs NQ 2025-12-19). Request resolves, per boundary Y/Y+1,
      the ESZ{Y}/ESH{Y+1}/NQZ{Y}/NQH{Y+1} outrights AND the Z-H calendar
      spread via parent/continuous symbology (per-year raw-symbol sharding
      CAUSED the DEC_ROLL_LATE_COMMIT defect; the MGC/SIL continuous-pull
      precedent avoids it). DR-1 + DR-2 bundled as ONE order (cost sheet
      section 5(a)).
    license:
      status: inherited-pending-verification
      note: >-
        Same Databento research-tier account as
        vendor_skie_ninja_legacy_raw_1min; operator re-verifies at order
        time.
    intended_use: >-
      Repair substrate for the DEC_ROLL_LATE_COMMIT critical defect:
      post-pull, the roll-adjusted derivative is RE-MATERIALIZED append-only
      (OD-F) with a NEW dated provenance JSON whose regenerated
      coverage_gaps reflect the repaired windows; the _20260711 provenance
      record is retained unedited as the pre-repair record. Downstream: the
      registered CONFIRMATION-GRADE H105 re-adjudication (a future-session
      adjudication event under the frozen VERDICT-1 protocol or a
      registered addendum — never an automatic pipeline tail step).
    spend_authorization: >-
      Authorized at governance level 2026-07-19 (principal direction,
      conveyed via session; cost-sheet authorization addendum). EXECUTION
      remains operator-only: no agent places the order, runs the metered
      download, or touches payment (cost sheet section 5(d)). Price:
      TBD — operator to quote via Historical.metadata.get_billable_size /
      get_cost (runbook:
      docs/research_notes/dr1_dr2_operator_runbook_2026-07-19.md).
    roll_convention_citation: >-
      CME equity roll date = the Monday prior to the third Friday of the
      expiration month (cmegroup.com/trading/equity-index/rolldates.html;
      pinned 2026-07-19).

  skie_universe_1_processed_roll_adjusted:
    kind: sibling_repo_reference   # reference-only per ADR-0011 Decision 2
    location: "~/Documents/SKIE-Universe/data/processed/vendor_legacy_1min_roll_adjusted/"
    partitioning: "symbol={ES,MCL,MGC,NQ,SIL}"
    usable_as_evidence: false
    note: >-
      NOT an ingest source. Registered only as the numerical
      cross-validation benchmark for the ported Phase C ingest module
      (CLAUDE.md Verification: confirm numerical results against a
      reference implementation). 2.0 evidence bars are re-materialized from
      vendor_skie_ninja_legacy_raw_1min.

  skie_universe_1_kpi_reports:
    kind: sibling_repo_reference
    location: "~/Documents/SKIE-Universe/reports/"
    usable_as_evidence: false
    note: >-
      Read-only input for Phase B retro Expert Cards
      (P1-2.0-RETRO-CARD-1.0-REGISTER). Cards cite report paths + 1.0 git
      HEAD at read time; no data copied.
