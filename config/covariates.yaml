# Registered conditioning-covariate sets for shadow-ledger writes —
# mandated by ADR-0003 Decision 6 + ADR-0008 Decision 4 (pre-registered
# conditioning sets), enforced by
# src/skie_universe2/ledger/shadow_ledger.py (round-1 audit QUANT-1-7).
#
# Keyed by EXPERT FAMILY = the expert_id name before '@' (version bumps
# keep the family's registered covariate set; changing the set is a new
# registration entry written at pre-registration time, i.e. when the
# family's design.md is frozen — post-hoc covariates require a fresh
# registered cycle per ADR-0008 Decision 4).
#
# Enforcement: a ledger frame's cov_* columns must EXACTLY equal the
# registered set for every expert family present in the frame. A family
# absent from this file has the empty registered set — any cov_* column
# is refused. This makes cross-partition covariate-set drift within a
# family impossible by construction.
#
# Column naming: covariates are Float64 wide columns prefixed cov_
# (ADR-0003 Decision 6 storage convention).
#
# Candidate conditioning covariates (the ADR-0002(b) project-standard set and
# its pre-registered extensions, e.g. the H900 regime family) live in
# config/conditioning_covariates.yaml. An expert that conditions on one of
# those registers the corresponding cov_ column HERE at its own design freeze;
# this file stays empty until the first such expert is admitted.

schema_version: 1

expert_families:
  # Documented example (registration shape):
  #
  #   toy_momentum:
  #     registered_at: "2026-07-10"
  #     design_md: "research/toy_momentum/design.md"
  #     covariates:
  #       - cov_realized_vol_60m
  #       - cov_session_phase
  #
  overnight_session_drift:
    registered_at: "2026-07-19"
    design_md: "research/01_hypothesis_register/H105/design.md"
    # EMPTY registered set (design §3): the H105 ledger partitions carry NO
    # cov_ columns; the RC-H105-1 screen computes the frozen conditioning
    # set (rvol_entry terciles, prior_rth_sign) inline from the substrate at
    # scan time — the leakage-clean RC-H101-2/RC-H103-2 path. A materialized
    # full-sample percentile column would be the leaked construction the
    # H103 exhibit convicted (construction_dependence_note,
    # config/conditioning_covariates.yaml). Promoting any covariate to a
    # ledger column is a fresh registered cycle per ADR-0008 Decision 4.
    covariates: []
  vr_range_reversal:
    registered_at: "2026-07-19"
    design_md: "research/01_hypothesis_register/H106/design.md"
    # EMPTY registered set (design §3): screen covariates (rvol_entry
    # terciles, vr_state_at_open) computed inline at scan time — the same
    # leakage-clean path as overnight_session_drift above. The expert's
    # signal-internal VR state (registered feature constants, window 288 /
    # q 2) is a Layer-1 input, not a ledger covariate column.
    covariates: []
  vwap_ema_cross:
    registered_at: "2026-11-22"
    design_md: "research/01_hypothesis_register/H107/design.md"
    # EMPTY registered set (design §3): H107 registers NO conditioning cells
    # (the family is the EMA-span grid); the regime-bias conditioning is a
    # separately pre-registered successor hypothesis (design §1). Ledger
    # families vwap_ema{N}_cross_k{f} carry no cov_ columns.
    covariates: []
