# Family-wise trial register — schema per ADR-0008 Decision 6.
# Every scan (exploration or confirmation tier) APPENDS one per-trial record.
# DSR consumes (N_eff estimated from clustering metadata, cross-trial SR
# variance); PBO consumes the trial matrix reconstructed from
# return_series_ref pointers. A raw count is NOT a sufficient input
# (ADR-0007 Decision 3).
schema_version: 1
# ENACTED 2026-07-17 by the P1-2.0-KELLY-SWEEP-DISCOVERY-ALPHA-CALIBRATE numeric
# instantiation, round-1 audit-remediated (methodology memo addendum §A; ReproLog
# repro_log_ba92c200ec074f6e961d2a6632bb45ff.json; artifact
# reports/discovery_alpha_calibration/discovery_alpha_calibration.json).
# Value = the RD4 MPRR posterior-null cutoff t*, median of the 24-point
# enactment band (instrument x mu-anchor x H_dem {1,2,4} windows x r_backstop
# {0, 0.3332}); band [0.5096, 0.8867]; bootstrap 95% CI [0.4239, 1.0000];
# closed-form benchmark (H_dwell/H_dem) x 4/(1-r). FULL-PRECISION value below
# governs every gate comparison (rounding-free; audit REPRODUCIBILITY-1-3).
# Semantics: the project-wide screening error BUDGET — ADR-0014 (S-c) passes
# iff mean gross > 0 AND RW-adjusted p < level; (S-d) DSR >= 1 - level =
# 0.2599, PBO <= level. The p/DSR/PBO applications are PROVISIONAL OPERATIONAL
# PROXIES of the posterior-null budget (scale-transfer deviation, memo §A.6.2).
# RD5 criterion at this level: retain-fwer at every registered family size
# (Romano-Wolf stays; no BH enacted; prds_argument_ref stays null; N > 20 rows
# conditional on dependence transfer, re-decided at the first swept scan).
# Licensed ONLY while the RD2 controls hold (Memo-1 ruin sizing + ADR-0010
# minimum-size ramp + non-waivable verdict ladder); re-instantiated on the
# first arsenal admission (addendum §A.8 standing conditions).
screening_error_rate_target: 0.7400550140326007
families:
  - family_id: h900-dwell-time-feasibility
    # Singleton methodology-gate family: one pre-registered analysis with no
    # selection surface, hence no correction due (H900 design.md §8). Any
    # post-hoc scan on the same substrate joins this family and triggers the
    # multipletest-gate.
    correction: none-singleton
    prds_argument_ref: null
    trials:
      - hid: H900
        sharpe_estimate: null   # not a Sharpe-family trial; dwell-time feasibility gate
        return_series_ref: null # no return series; sojourn-distribution study
        clustering:
          cluster_key: h900-singleton
          notes: >-
            Founding feasibility gate per ADR-0004 Decision 6; frozen design at
            research/01_hypothesis_register/H900/design.md.
        registered_at: "2026-07-10"
  - family_id: allocator-confirmation-kelly-sweep
    # STATUS: accepted — enacted on ADR-0013 acceptance 2026-07-12 (aggressive
    # geometric-growth mandate). The family registration is in force; the
    # correction LEVEL/criterion and the kelly outputs were NUMERIC-INSTANTIATED
    # 2026-07-17 (registered blocks below); no swept trial is appended before
    # the first swept scan.
    # Registers the Kelly-fraction sweep as a
    # trial-family EXPANSION per ADR-0013 Decision 4: every
    # (allocator-config x Kelly-fraction) pair over the registered grid
    # {0.5, 0.75, 1.0, 1.25} is a DISTINCT trial carried in this family and covered
    # by the ADR-0007 SPA/StepM correction over the enlarged family. Loss
    # differentials are re-defined on geometric (log-wealth) growth (ADR-0013
    # Decision 2). Expanding the family by the Kelly dimension is strictly MORE
    # conservative (larger N); aggressive sizing is paid for by honest
    # multiplicity accounting, never exempted from it (ADR-0013 Decision 4 /
    # Consequences). Per ADR-0013 Consequences this file must carry the
    # (config x Kelly-fraction) family BEFORE the first swept scan.
    status: accepted   # family registration in force (ADR-0013 accepted 2026-07-12); the two Decision-9 memos are NUMERIC-INSTANTIATED 2026-07-17 (level enacted above; kelly outputs recorded below) — trials appended at the first swept scan
    correction: romano-wolf   # ADR-0007 Decision 3 SPA existence + StepM identification; the 2026-07-17 numeric instantiation resolved the criterion to retain-fwer at every family size (RD5), so Romano-Wolf stays; BH was NOT enacted (rows N > 20 conditional on dependence transfer; re-decided on this family's own dependence at its first swept scan)
    prds_argument_ref: null   # required iff the calibrate follow-up resolves correction to benjamini-hochberg-prds
    # grid endpoints (0.5 half-Kelly / 1.25 leveraged) and 0.25 spacing are an OUTPUT of calibration follow-ups P1-2.0-KELLY-SWEEP-DISCOVERY-ALPHA-CALIBRATE and P1-2.0-KELLY-GROWTH-CONCAVITY-RUIN-DERIVE, not hand-tuned constants
    kelly_fraction_grid: [0.5, 0.75, 1.0, 1.25]  # registered swept hyperparameter (ADR-0013 Decision 3); pre-registered sweep values, not hand-tuned constants; brackets the estimation-error-adjusted geometric-growth optimum from half-Kelly (~0.5) through leveraged (1.25) so the data-selected winner is not structurally floored above the growth optimum; winning fraction data-selected by best geometric growth over the joint (config x fraction) space
    trials: []   # no swept confirmation scan has run; one per-trial record per (config x Kelly-fraction) pair is appended here before the first swept scan (ADR-0013 Consequences)
    # Registered outputs of the two Decision-9 numeric instantiations
    # (2026-07-17; RD6 "register with the family" obligation):
    discovery_alpha_calibration:
      repro_log_run: ba92c200ec074f6e961d2a6632bb45ff
      artifact: reports/discovery_alpha_calibration/discovery_alpha_calibration.json
      lambda_band_enactment: [1.04, 7.83]       # RD1/RD2 loss ratio over the 24-point band
      t_star_enacted: 0.7400550140326007        # RD4 MPRR cutoff (= screening_error_rate_target; median of the band)
      enactment_band: [0.5096, 0.8867]          # instrument x anchor x H_dem {1,2,4} x r {0, 0.3332}
      r_backstop_axis: [0.0, 0.3332]            # censored-record prior band (audit QUANT-1-4)
      h_dem_axis_windows: [1, 2, 4]             # demotion-latency assumption band (audit QUANT-1-3)
      pi1_band_hit_rate_jeffreys95: [0.00015, 0.5356]  # RD3 primary (0/3 admitted)
      criterion_decision: retain-fwer           # RD5 at every registered family size (N > 20 conditional)
    kelly_growth_calibration:
      repro_log_run: d371b253d6be47e596ea0aa99182801e
      artifact: reports/kelly_growth_calibration/kelly_growth_calibration.json
      grid_bracketing_verdict: inconclusive-on-null-ledger  # memo addendum §B.3; re-instantiate at first admission
      f_zero_range: [1.978, 1.990]              # D4 over-betting crossing (thin-tail benchmark 2.0)
      single_bar_ruin_all_grid_points: 0.0      # D3/D5; CIs [0, 0]
      es_net_degenerate: true                   # no favourable bet on the realizable ES stream
    registered_at: "2026-07-12"
  - family_id: h001-volxtrend-covariate
    # H001 conditioning-covariate NON-REDUNDANCY scan (ADR-0002(d)): does the
    # small-n vol x trend 4-state label add information about forward
    # reversion/continuation (a self-normalizing within-window forward
    # variance-ratio proxy) BEYOND the registered H900 HMM covariate
    # (regime_hmm_h900) and the project-standard variance_ratio_state? Pre-registered
    # scan surface = trend_family(4) x vol_family(4) x n_t(5) x n_v(5) = 400 arms x
    # 2 horizons {6,12}. This is a COVARIATE-INFORMATION family (conditional mutual
    # information + nested OOS predictive-information delta), NOT a Sharpe-selection
    # surface, so sharpe_estimate/return_series_ref are null for its trials; DSR/PBO
    # do not bind the primary (they bind the DEFERRED ADR-0002(c)
    # conditional-gross-edge scan on the shadow ledger). Design frozen at
    # research/01_hypothesis_register/H001/design.md (design.md SHA carried by the
    # /preregister freeze ReproLog).
    correction: romano-wolf   # ADR-0002(c) default, block bootstrap over the pooled bar-level contribution series (design §8); the project-wide screening_error_rate_target was ENACTED 2026-07-17 (see top of file) — this scan ran 2026-07-16 under the then-null level and stays descriptively reported; no arm certified
    prds_argument_ref: null
    # Scan EXECUTED 2026-07-16 (primary variant, ES+NQ). Because the screening/FWER
    # level is the DEFERRED project-wide screening_error_rate_target (null), the scan
    # is reported DESCRIPTIVELY and NO arm is certified as a discovery. Disposition
    # archive(null): the covariate-information statistic (MM-CMI) is a tiny large-N
    # residual (~1e-4 nats) that fails the out-of-sample predictive guard, so no
    # discovery is claimed regardless of the deferred level. Full per-arm records
    # (1600 arm-horizons) are the scan tables reports/H001/h001_scan_primary.*; a
    # per-trial expansion is not appended here because no arm is certified.
    trials: []   # descriptive scan; no certified discovery -> no per-trial certification record (see note)
    scan_executed:
      - variant: primary
        instruments: [ES, NQ]
        n_arm_horizons: 1600
        disposition: "archive(null) — fails OOS predictive guard; not certified (screening level deferred)"
        return_series_ref: reports/H001/h001_scan_primary.parquet
        repro_log_run: e97678dfddf64306876ad5a34efb2956
        executed_at: "2026-07-16"
    registered_at: "2026-07-16"
